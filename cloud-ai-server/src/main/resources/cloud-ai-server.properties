# Cloud AI 独立服务器配置 — 由 CloudAiApplication 显式加载（命名避开 application.*，
# 防止 cloud-ai-spring 场景下被 Spring Boot 自动装配误读）。
# 支持 ${ENV_VAR:default} 环境变量占位符；外部 ./cloud-ai-server.properties 可覆盖本文件。

server.port=8080
cloud-ai.server.api-key=

# ---- LLM 提供商（至少配置一个，api-key 必填） ----
cloud-ai.llm.default-provider=${CLOUD_AI_LLM_PROVIDER:openai}
cloud-ai.llm.providers.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
cloud-ai.llm.providers.openai.api-key=${OPENAI_API_KEY:}
cloud-ai.llm.providers.openai.model=${OPENAI_MODEL:gpt-4o}
cloud-ai.llm.providers.openai.timeout=60s
#cloud-ai.llm.providers.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
#cloud-ai.llm.providers.deepseek.api-key=${DEEPSEEK_API_KEY:}
#cloud-ai.llm.providers.deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-pro}
#cloud-ai.llm.providers.deepseek.timeout=120s
#cloud-ai.llm.providers.deepseek.capabilities=chat,tool_calling,thinking
#cloud-ai.llm.providers.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
#cloud-ai.llm.providers.anthropic.api-key=${ANTHROPIC_API_KEY:}
#cloud-ai.llm.providers.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4}

# ---- Agent 循环 ----
cloud-ai.agent.type=react
cloud-ai.agent.max-turns=50
cloud-ai.agent.timeout=10m
cloud-ai.agent.max-plan-steps=10
# 单次 LLM 调用允许的历史 token 预算（超出时裁剪请求视图，会话原始历史保留）
cloud-ai.agent.max-context-tokens=8000

# ---- 记忆 ----
cloud-ai.memory.max-retrieval-results=5

# ---- 安全 ----
cloud-ai.security.approval.mode=auto
cloud-ai.security.approval.timeout=120s

# ---- 工具执行 ----
cloud-ai.execution.file-read-enabled=true
cloud-ai.execution.file-write-enabled=true
cloud-ai.execution.shell-enabled=true
cloud-ai.execution.shell.timeout=30s
cloud-ai.execution.filesystem.workspace=./workspace

# ---- 上下文与技能 ----
cloud-ai.context.work-dir=.
cloud-ai.skills.enabled=true
